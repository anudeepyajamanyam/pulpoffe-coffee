services:
  - type: web
    name: pulpoffe-coffee
    env: node
    plan: free
    buildCommand: npm install && node scripts/build-worker.mjs && node scripts/build-render.mjs
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: ADMIN_EMAILS
        value: admin@pulpoffe.com
